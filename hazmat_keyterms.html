<style>
  :root { color-scheme: dark !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background-color:#111111 !important; color:#f0f0f0 !important; margin:0; padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }

  /* Nav */
  .nav { display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:10px 12px;
    background:#1a1a1a; border-bottom:1px solid #2a2a2a; position:sticky; top:0; z-index:10; }
  .nav-title { font-weight:800; letter-spacing:2px; color:#c0392b; margin-right:6px; font-size:15px; }
  .nav a.nav-btn { text-decoration:none; display:inline-block; font-size:12px; color:#aaa;
    padding:5px 9px; border-radius:7px; background:#222; }
  .nav a.nav-btn.active { color:#fff; background:#c0392b; }

  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:6px 0 2px; }
  .sub { color:#888; font-size:13px; margin-bottom:14px; }

  /* Chapter filter */
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { font-size:12px; padding:6px 10px; border-radius:20px; background:#222; color:#bbb;
    border:1px solid #2e2e2e; cursor:pointer; }
  .chip.active { background:#ff5252; color:#fff; border-color:#c0392b; }

  /* Controls */
  .bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px; }
  .count { font-size:13px; color:#999; }
  .btn { font-size:13px; padding:7px 12px; border-radius:8px; background:#262626; color:#eee;
    border:1px solid #333; cursor:pointer; }
  .btn:active { background:#333; }

  /* Card */
  .card { perspective:1200px; height:340px; margin-bottom:14px; }
  .inner { position:relative; width:100%; height:100%; transition:transform .45s;
    transform-style:preserve-3d; cursor:pointer; }
  .inner.flipped { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; backface-visibility:hidden; border-radius:16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:26px;
    text-align:center; border:1px solid #2e2e2e; }
  .front { background:#1c1c1c; }
  .back { background:#15201c; transform:rotateY(180deg); border-color:#1f3a2e; }
  .tag { position:absolute; top:14px; left:16px; font-size:11px; font-weight:700; letter-spacing:1px;
    color:#c0392b; }
  .hint { position:absolute; bottom:14px; font-size:11px; color:#666; }
  .term { font-size:23px; font-weight:700; line-height:1.25; }
  .def { font-size:17px; line-height:1.5; color:#dfe; }

  .move { display:flex; gap:10px; }
  .move .btn { flex:1; }
  .empty { text-align:center; color:#777; padding:40px 0; }
</style>
</head>

{ch:"Ch2",q:"Inhalation Hazard",a:"Material dangerous when breathed in."},

{ch:"Ch2",q:"Pesticides",a:"Chemicals used to kill pests. Often toxic."},
{ch:"Ch2",q:"Placard",a:"Diamond sign at least 10.8 in per side on vehicles/containers showing hazard class."},
{ch:"Ch2",q:"Poison",a:"Substance that causes injury or death by chemical action."},
{ch:"Ch2",q:"Preincident Survey",a:"Pre-planning visit to gather info on a facility before an emergency."},
{ch:"Ch2",q:"Pressure Vessel",a:"Container designed to hold contents at high pressure."},
{ch:"Ch2",q:"Pressurized Container",a:"Container holding a material under pressure."},
{ch:"Ch2",q:"Reporting Marks",a:"Letters/numbers on rail cars used to ID contents. Same as railcar initials and numbers."},

{ch:"Ch2",q:"Self-Accelerating Decomposition Temperature (SADT)",a:"Lowest temperature at which a material self-decomposes, accelerating on its own."},

{ch:"Ch2",q:"Structural Fire Fighting Protective Clothing",a:"Standard bunker gear. Limited hazmat protection."},
{ch:"Ch2",q:"Thermal Runaway",a:"Self-accelerating reaction where rising heat speeds the reaction, producing more heat — can lead to explosion."},
{ch:"Ch2",q:"Toxic",a:"Capable of causing injury or death through chemical action."},
{ch:"Ch2",q:"Transportation Mode",a:"Method of transport — highway, rail, air, water, or pipeline."},
{ch:"Ch2",q:"UN/NA Identification Number",a:"4-digit number identifying a hazardous material in transport."},
{ch:"Ch2",q:"Vapor Explosion",a:"Explosion of an ignited vapor cloud."},
{ch:"Ch2",q:"Waybill",a:"Shipping paper used in rail transport."},
{ch:"Ch2",q:"Wireless Information System for Emergency Responders (WISER)",a:"Software tool providing hazmat info to responders."},

{ch:"Ch3",q:"Decontamination",a:"Removing or neutralizing contaminants from people, equipment, and environment."},

{ch:"Ch3",q:"Evacuation",a:"Moving people out of a threatened area to safety."},

{ch:"Ch3",q:"Inhibitor",a:"Substance added to prevent or slow an unwanted reaction like polymerization."},

{ch:"Ch3",q:"Isolation Perimeter",a:"Outer boundary controlling access to the incident."},

{ch:"Ch3",q:"Protective Action Distance",a:"Downwind area where people may be harmed and protective action is needed."},
{ch:"Ch3",q:"Self-Contained Breathing Apparatus (SCBA)",a:"Respirator with a personal air supply carried by the user."},
{ch:"Ch3",q:"Sheltering in Place",a:"Directing people to stay indoors and seal the space until the hazard passes."},
{ch:"Ch3",q:"Stabilizer",a:"Substance added to keep a material from reacting or decomposing."},
{ch:"Ch3",q:"Street Clothes",a:"Everyday clothing. No protection."},
{ch:"Ch3",q:"Toxic Inhalation Hazard (TIH)",a:"Material poisonous when inhaled. Requires large protective distances."},
// Ch4
{ch:"Ch4",q:"Acid",a:"Substance with pH below 7. Donates hydrogen ions."},

{ch:"Ch4",q:"Acute Exposure",a:"Short, single exposure to a hazard."},
{ch:"Ch4",q:"Aerosol",a:"Fine solid or liquid particles suspended in gas."},
{ch:"Ch4",q:"Allergen",a:"Substance that triggers an allergic reaction."},
{ch:"Ch4",q:"Alpha Radiation",a:"Heavy, low-penetrating radiation. Stopped by paper or skin but dangerous if internal."},
{ch:"Ch4",q:"Asphyxiant",a:"Gas that displaces oxygen or blocks its use."},
{ch:"Ch4",q:"Autoignition Temperature",a:"Lowest temperature at which a material ignites without an external spark or flame."},
{ch:"Ch4",q:"Bacteria",a:"Single-celled microorganisms. Some cause disease."},

{ch:"Ch4",q:"Basic Solution",a:"Solution with pH above 7."},
{ch:"Ch4",q:"Beta Radiation",a:"Light, moderately penetrating radiation. Stopped by thin metal or plastic."},
{ch:"Ch4",q:"Biological Agent",a:"Living organism or toxin used to cause disease or death."},
{ch:"Ch4",q:"Biological Hazards",a:"Hazards from living organisms or their products."},
{ch:"Ch4",q:"Biological Toxins",a:"Poisonous substances produced by living organisms."},
{ch:"Ch4",q:"Boiling Point",a:"Temperature at which a liquid turns to vapor."},
{ch:"Ch4",q:"Breach",a:"Failure or opening in a container that lets contents escape."},
{ch:"Ch4",q:"Carbon Dioxide (CO2)",a:"Colorless, odorless gas. Simple asphyxiant."},
{ch:"Ch4",q:"Carbon Monoxide (CO)",a:"Colorless, odorless toxic gas. Chemical asphyxiant."},
{ch:"Ch4",q:"Chemical Properties",a:"How a material reacts or changes chemically."},
{ch:"Ch4",q:"Combustible Liquid",a:"Liquid with a flash point at or above 100°F (37.8°C)."},
{ch:"Ch4",q:"Compressed Gas",a:"Gas stored under pressure in a container."},
{ch:"Ch4",q:"Concentration",a:"Amount of a substance in a given volume."},
{ch:"Ch4",q:"Condensation",a:"Gas or vapor changing to liquid."},
{ch:"Ch4",q:"Contagious",a:"Capable of spreading from person to person."},
{ch:"Ch4",q:"Contaminant",a:"Substance present where it doesn't belong."},
{ch:"Ch4",q:"Convulsant",a:"Substance that causes convulsions or seizures."},
{ch:"Ch4",q:"Degradation",a:"Breakdown of a material's properties."},
{ch:"Ch4",q:"Deposition",a:"Gas changing directly to a solid."},
{ch:"Ch4",q:"Dispersion",a:"How a hazmat spreads through the environment."},
{ch:"Ch4",q:"Dose",a:"Amount of a substance a person is exposed to."},
{ch:"Ch4",q:"Electron",a:"Negatively charged subatomic particle."},
{ch:"Ch4",q:"Engulfment",a:"Being surrounded or buried by a material."},
{ch:"Ch4",q:"Etiological Hazards",a:"Hazards from disease-causing microorganisms."},
{ch:"Ch4",q:"Fire Point",a:"Temperature at which a liquid produces enough vapor to sustain burning. Slightly above flash point."},

{ch:"Ch4",q:"Flash Point",a:"Lowest temperature at which a liquid gives off enough vapor to flash ignite — not sustained burning."},
{ch:"Ch4",q:"Freezing",a:"Liquid changing to solid."},

{ch:"Ch4",q:"Gas",a:"State of matter with no fixed shape or volume."},
{ch:"Ch4",q:"General Emergency Behavior Model (GEBMO)",a:"Model describing how hazmat behaves once released."},
{ch:"Ch4",q:"Hazard and Risk Assessment",a:"Evaluating hazards and the risk they pose to guide action."},
{ch:"Ch4",q:"Hemispheric Release",a:"Release that spreads as a dome or half-sphere from the source."},

{ch:"Ch4",q:"Immiscible",a:"Doesn't mix with water."},
{ch:"Ch4",q:"Infectious",a:"Capable of causing infection."},
{ch:"Ch4",q:"Inhibitor",a:"Substance that slows or prevents a reaction."},

{ch:"Ch4",q:"Miscibility",a:"Ability of liquids to mix."},

{ch:"Ch4",q:"Pathogen",a:"Disease-causing microorganism."},

{ch:"Ch4",q:"Photon",a:"Particle of electromagnetic energy or light."},

{ch:"Ch4",q:"Solid",a:"State of matter with fixed shape and volume."},

// Chapters in order
const CHAPTERS = ["All"];
for (let i=1;i<=16;i++){ if (CARDS.some(c=>c.ch==="Ch"+i)) CHAPTERS.push("Ch"+i); }

let filter = "All";
let deck = [];
let idx = 0;

const chips = document.getElementById('chips');
const inner = document.getElementById('inner');
const tag = document.getElementById('tag');
const tagB = document.getElementById('tagB');
const front = document.getElementById('front');
const back = document.getElementById('back');
const count = document.getElementById('count');

function buildChips(){
  chips.innerHTML = '';
  CHAPTERS.forEach(ch=>{
    const el = document.createElement('div');
    el.className = 'chip' + (ch===filter?' active':'');
    el.textContent = ch;
    el.onclick = ()=>{ filter=ch; idx=0; rebuild(); };
    chips.appendChild(el);
  });
}

function rebuild(){
  deck = filter==="All" ? CARDS.slice() : CARDS.filter(c=>c.ch===filter);
  buildChips();
  render();
}

function render(){
  if (!deck.length){ count.textContent='No cards'; return; }
  if (idx>=deck.length) idx=0;
  const c = deck[idx];
  inner.classList.remove('flipped');
  tag.textContent = c.ch;
  tagB.textContent = c.ch;
  front.textContent = c.a;
  back.textContent = c.q;
  count.textContent = (idx+1)+' / '+deck.length;
}

function shuffle(){
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  idx=0; render();
}

inner.onclick = ()=> inner.classList.toggle('flipped');
document.getElementById('next').onclick = ()=>{ idx=(idx+1)%deck.length; render(); };
document.getElementById('prev').onclick = ()=>{ idx=(idx-1+deck.length)%deck.length; render(); };
document.getElementById('shuffle').onclick = shuffle;

// Swipe
let sx=0;
document.getElementById('cardArea').addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; },{passive:true});
document.getElementById('cardArea').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>50){ if(dx<0){ idx=(idx+1)%deck.length; } else { idx=(idx-1+deck.length)%deck.length; } render(); }
});

rebuild();
</script>
</body>
</html>
