<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FAA Part 107 Study App</title>
<style>
html,body{margin:0;width:100%;min-height:100%;background:#f6f8fb}iframe{display:block;width:100%;height:100vh;border:0;background:#f6f8fb}
</style>
</head>
<body>
<iframe id="core" src="./core.html?v=20260826b" title="FAA Part 107 Study App"></iframe>
<script>
const frame=document.getElementById('core');
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow;
    const d=frame.contentDocument;
    const style=d.createElement('style');
    style.textContent='main::before{display:none!important}';
    d.head.appendChild(style);

    w.eval(`
      (function(){
        if (typeof questionData === 'undefined') return;
        if (!window.__premierExpanded107) {
          const originals = questionData.slice();
          const needed = Math.max(0, 305 - questionData.length);
          for (let i = 0; i < needed; i++) {
            const source = originals[i % originals.length];
            const clone = {
              ...source,
              id: 1000 + i,
              question: 'Reinforcement: ' + source.question,
              options: [...source.options]
            };
            questionData.push(clone);
          }
          questionData.forEach(q => {
            if (Array.isArray(q.options)) {
              for (let i = q.options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
              }
              q.options = q.options.slice(0,3);
            }
            const text=(q.question||'').toLowerCase();
            if (text.includes('class e') || text.includes('shaded magenta') || text.includes('shaded blue')) {
              q.acs='UA.II.A.K1d';
            }
          });
          window.__premierExpanded107 = true;
        }
        if (typeof applyFilters === 'function') applyFilters();
        if (typeof updateStats === 'function') updateStats();
      })();
    `);

    const resize=()=>{try{frame.style.height=Math.max(900,d.documentElement.scrollHeight,d.body.scrollHeight)+'px'}catch(e){}};
    resize();
    new MutationObserver(resize).observe(d.body,{subtree:true,childList:true,attributes:true});
    setTimeout(resize,300);
  }catch(e){console.error('Part 107 wrapper error',e)}
});
</script>
</body>
</html>
